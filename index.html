<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applemax Legal Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lato:wght@400;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f6f8;
      font-family: "Lato", sans-serif;
      padding: 20px;
    }

    .card {
      background-color: #007bff;
      color: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 123, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-family: "Lexend", sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-links a {
      font-family: "Lato", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #007bff;
      background-color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Terms of Service & Privacy Notices for Applemax Services</h1>
    <nav class="nav-links">
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </main>

</body>
</html>
