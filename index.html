<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  
  <style>
    /* Reset margins and center the square on the full screen */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f4; /* Optional background color */
    }

    /* The centered blue square container */
    .blue-square {
      background-color: #007bff; /* Blue background */
      color: white;              /* White text for contrast */
      width: 400px;              /* Fixed width */
      height: 400px;             /* Fixed height to make it a square */
      padding: 24px;
      box-sizing: border-box;    /* Includes padding inside width/height */
      
      /* Center items vertically and horizontally inside the square */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      
      border-radius: 8px;        /* Optional slight rounded corners */
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      font-family: "Lexend", sans-serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-style: normal;
      text-align: center;
    }

    /* Link styling for dark background visibility */
    a {
      font-family: "Lato", sans-serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-style: normal;
      text-align: center;
      color: #ffffff;
      margin: 0 8px;
    }
  </style>
</head>
<body>

  <!-- Wrapped content inside the blue square container -->
  <div class="blue-square">
    <h1>Terms of Service concerning ALL services affiliated to applemax.me, applemax, or bkhr.</h1>
    <p>
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
    </p>
  </div>

</body>
</html>
